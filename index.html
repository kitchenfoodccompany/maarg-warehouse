<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Inventory Entry — The Maarg</title>
<meta name="theme-color" content="#185FA5">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow-x:hidden;max-width:100vw}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh}
  #login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
  .lcard{background:#fff;border-radius:16px;border:1px solid #e5e5e5;padding:2.5rem 2rem;width:100%;max-width:360px;text-align:center}
  .lin{width:100%;font-size:15px;padding:10px 14px;border-radius:8px;border:1px solid #ddd;outline:none;margin-bottom:10px;text-align:center;letter-spacing:2px}
  .lbtn{width:100%;background:#185FA5;color:#fff;border:none;border-radius:8px;padding:11px;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit}
  .lerr{font-size:13px;color:#A32D2D;margin-top:10px;display:none}
  #app{display:none}
  .top{background:#fff;border-bottom:1px solid #e5e5e5;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
  .top h1{font-size:16px;font-weight:600}
  .out{font-size:12px;color:#999;background:none;border:none;cursor:pointer;text-decoration:underline;font-family:inherit}
  .body{padding:1.25rem 1rem 3rem}.wrap{max-width:820px;margin:0 auto}
  .card{background:#fff;border-radius:12px;border:1px solid #e5e5e5;padding:1.15rem;margin-bottom:1rem}
  .ct{font-size:14px;font-weight:600;margin-bottom:.85rem}
  label{display:block;font-size:12px;font-weight:600;color:#666;margin-bottom:5px}
  .f{margin-bottom:12px}
  input,select,textarea{width:100%;font-size:15px;padding:10px 12px;border-radius:9px;border:1px solid #ddd;outline:none;font-family:inherit;background:#fff}
  input:focus,select:focus,textarea:focus{border-color:#185FA5}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{background:#185FA5;color:#fff;border:none;border-radius:9px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;width:100%;font-family:inherit}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-out{background:#fff;color:#185FA5;border:2px solid #185FA5}
  .btn-grn{background:#1F7A3B}
  .btn2{background:#fff;border:1px solid #ddd;color:#333;border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .msg{font-size:13px;margin-top:10px;min-height:18px}
  .types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tb{padding:12px 8px;border-radius:9px;border:2px solid #e5e5e5;background:#fff;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;text-align:center}
  .tb.on{color:#fff}
  .tb[data-t=dispatched].on{background:#185FA5;border-color:#185FA5}
  .tb[data-t=returned].on{background:#1F7A3B;border-color:#1F7A3B}
  .tb[data-t=returned_damaged].on{background:#A32D2D;border-color:#A32D2D}
  .tb[data-t=new_stock].on{background:#7C3AED;border-color:#7C3AED}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#888;padding:7px 8px;border-bottom:2px solid #eee}
  td{padding:8px;border-bottom:1px solid #f2f2f2}
  .num{text-align:right;font-family:'SF Mono',Menlo,monospace}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;color:#fff;white-space:nowrap}
  .p-dispatched{background:#185FA5}.p-returned{background:#1F7A3B}
  .p-returned_damaged{background:#A32D2D}.p-new_stock{background:#7C3AED}.p-adjustment{background:#B45309}
  .low{color:#A32D2D;font-weight:700}
  .muted{color:#999;font-size:12px}
  .scroll{overflow-x:auto}
  .dates{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .dp{padding:7px 12px;border-radius:8px;border:1px solid #ddd;background:#fff;font-size:12.5px;cursor:pointer;font-family:inherit}
  .dp.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
  .dates input[type=date]{font-size:12.5px;padding:6px 8px;border-radius:8px;border:1px solid #ddd;font-family:inherit}
  .topseller{display:inline-block;background:#FEF3E2;color:#B45309;font-size:10px;font-weight:700;border-radius:20px;padding:1px 8px;margin-left:6px;vertical-align:middle}
  .batchrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
  .batchrow:last-child{border-bottom:none}
  .rm{background:none;border:none;color:#A32D2D;font-size:16px;cursor:pointer;padding:0 6px}
  .dayhead{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:10px 4px;border-bottom:1px solid #eee}
  .dayhead:hover{background:#fafafa}
  .dayhead .l{font-weight:600;font-size:13.5px}
  .dayhead .r{font-size:12px;color:#666}
  .dcontent{display:none;padding:0 4px 8px}
  .dcontent.open{display:block}
  @media(max-width:560px){.body{padding:1rem .75rem 2.5rem}.card{padding:1rem}.row2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login">
  <div class="lcard">
    <div style="font-size:36px;margin-bottom:1rem">📦</div>
    <div style="font-size:18px;font-weight:600;margin-bottom:4px">Inventory Entry</div>
    <div style="font-size:13px;color:#888;margin-bottom:1.5rem">The Maarg — warehouse access</div>
    <input type="password" class="lin" id="pw" placeholder="Enter password" onkeydown="if(event.key==='Enter')login()">
    <button class="lbtn" onclick="login()">Sign in</button>
    <div class="lerr" id="lerr">Incorrect password.</div>
  </div>
</div>

<div id="app">
  <div class="top"><h1>📦 Inventory Entry</h1><button class="out" onclick="logout()">Sign out</button></div>
  <div class="body"><div class="wrap">

    <!-- ── Step 1: build a batch of items ── -->
    <div class="card" id="entryCard">
      <div class="ct">Add items</div>
      <div class="f"><label>Your name</label><input id="by" placeholder="Who is entering this?"></div>

      <div class="f"><label>Entry type</label>
        <div class="types">
          <button class="tb" data-t="dispatched"       onclick="pickType('dispatched',this)">📤 Dispatched</button>
          <button class="tb" data-t="returned"         onclick="pickType('returned',this)">↩️ Returned</button>
          <button class="tb" data-t="returned_damaged" onclick="pickType('returned_damaged',this)">💔 Returned Damaged</button>
          <button class="tb" data-t="new_stock"        onclick="pickType('new_stock',this)">➕ New Stock</button>
        </div>
      </div>
      <div class="row2">
        <div class="f"><label>Date</label><input type="date" id="date"></div>
        <div class="f"><label>Quantity</label><input type="number" id="qty" min="1" step="1" placeholder="0"></div>
      </div>
      <div class="f"><label>Product</label><select id="product"><option value="">Select product…</option></select></div>
      <div class="f" id="refWrap" style="display:none"><label>Order reference number <span style="color:#A32D2D">*</span></label>
        <input id="orderRef" placeholder="e.g. 14391"><div class="muted" style="margin-top:4px">Required for returns.</div></div>
      <div class="f"><label>Note (optional)</label><input id="note" placeholder="Anything worth recording"></div>

      <button class="btn" onclick="addToBatch()">➕ Add item to this batch</button>
      <div class="msg" id="addmsg"></div>

      <div id="batchList" style="margin-top:14px"></div>
      <button class="btn btn-grn" id="reviewBtn" style="display:none;margin-top:10px" onclick="showReview()">Review &amp; Submit →</button>
    </div>

    <!-- ── Step 2: review before saving ── -->
    <div class="card" id="reviewCard" style="display:none">
      <div class="ct">Review before submitting</div>
      <div id="reviewList"></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn btn-out" onclick="backToEntry()">← Back to edit</button>
        <button class="btn btn-grn" id="submitBtn" onclick="submitBatch()">✓ Confirm &amp; Save All</button>
      </div>
      <div class="msg" id="submitmsg"></div>
    </div>

    <div class="card">
      <div class="ct">Current stock</div>
      <div class="scroll"><table id="stock"></table></div>
    </div>

    <div class="card">
      <div class="ct">Recent Entries</div>
      <div class="dates">
        <button class="dp" onclick="setHistRange('today',this)">Today</button>
        <button class="dp" onclick="setHistRange('yesterday',this)">Yesterday</button>
        <button class="dp on" onclick="setHistRange('7',this)">7 days</button>
        <button class="dp" onclick="setHistRange('30',this)">30 days</button>
        <button class="dp" onclick="setHistRange('all',this)">All time</button>
        <input type="date" id="hf" onchange="setHistRange('custom')"><span class="muted">to</span>
        <input type="date" id="ht" onchange="setHistRange('custom')">
      </div>
      <div id="hist"></div>
    </div>

  </div></div>
</div>

<script>
const APP_PASSWORD = 'MaargStock2026!';   // ← CHANGE before sharing with the partner
const SECRET = 'Labila49!';               // must match API_SECRET in Vercel
const PROXY  = 'https://shopify-order-proxy.vercel.app';
const AUTH   = 'maarg_inv_partner_auth';
const LOW_STOCK = 10;
const TYPE_LABEL = {dispatched:'Dispatched',returned:'Returned',returned_damaged:'Damaged',new_stock:'New Stock',adjustment:'Adjustment'};

let DATA=null, TYPE=null, BATCH=[];

function login(){
  if(document.getElementById('pw').value === APP_PASSWORD){ sessionStorage.setItem(AUTH,'1'); show(); }
  else { document.getElementById('lerr').style.display='block'; document.getElementById('pw').value=''; }
}
function logout(){ sessionStorage.removeItem(AUTH); location.reload(); }
function show(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('date').value = new Date().toISOString().slice(0,10);
  const n = localStorage.getItem('maarg_inv_name'); if(n) document.getElementById('by').value = n;
  load();
}
if(sessionStorage.getItem(AUTH)==='1') window.addEventListener('DOMContentLoaded',show);

function pickType(t,el){
  TYPE = t;
  document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('refWrap').style.display = (t==='returned'||t==='returned_damaged') ? 'block' : 'none';
}

async function api(body){
  const opt = body
    ? { method:'POST', headers:{'Content-Type':'application/json','x-api-secret':SECRET}, body:JSON.stringify(body) }
    : { headers:{'x-api-secret':SECRET} };
  const r = await fetch(`${PROXY}/api/inventory`, opt);
  const j = await r.json();
  if(!r.ok) throw new Error(j.error||'Request failed');
  return j;
}

async function load(){
  try{
    DATA = await api(null);
    const sel = document.getElementById('product');
    sel.innerHTML = '<option value="">Select product…</option>' + DATA.products.map(p=>`<option>${p}</option>`).join('');
    render();
  }catch(e){ document.getElementById('addmsg').innerHTML = `<span style="color:#A32D2D">Could not load: ${e.message}</span>`; }
}

function active(){ return (DATA.events||[]).filter(e=>e.status==='active'); }
function computeStock(){
  const s={}, d={};
  DATA.products.forEach(p=>{ s[p]=DATA.opening[p]||0; d[p]=0; });
  active().forEach(e=>{
    if(!(e.product in s)){ s[e.product]=0; d[e.product]=0; }
    if(e.type==='dispatched') s[e.product]-=e.qty;
    else if(e.type==='returned'||e.type==='new_stock') s[e.product]+=e.qty;
    else if(e.type==='returned_damaged') d[e.product]+=e.qty;
    else if(e.type==='adjustment') s[e.product]+=e.qty;
  });
  return {stock:s, damaged:d};
}

// ── Step 1: local batch building (nothing saved to server yet) ──
function addToBatch(){
  const msg = document.getElementById('addmsg');
  if(!TYPE) return msg.innerHTML = err('Choose an entry type.');
  const product = document.getElementById('product').value;
  const qty = Number(document.getElementById('qty').value);
  const orderRef = document.getElementById('orderRef').value.trim();
  if(!product) return msg.innerHTML = err('Choose a product.');
  if(!(qty>0)) return msg.innerHTML = err('Enter a quantity.');
  if((TYPE==='returned'||TYPE==='returned_damaged') && !orderRef) return msg.innerHTML = err('Order reference is required for returns.');

  BATCH.push({
    date: document.getElementById('date').value, type: TYPE, product, qty,
    orderRef: orderRef || null, note: document.getElementById('note').value.trim(),
  });
  // Reset product + qty + ref + note so the next item starts fresh — this is
  // what makes it obvious you can add a DIFFERENT product next, not just
  // more of the same one. Type and date stay selected since those are
  // usually the same across several items in one visit.
  document.getElementById('product').value='';
  document.getElementById('qty').value=''; document.getElementById('orderRef').value=''; document.getElementById('note').value='';
  document.getElementById('product').focus();
  msg.innerHTML = '<span style="color:#1F7A3B">✓ Added — pick your next product below, or Review & Submit when done.</span>';
  renderBatch();
}
function err(m){ return `<span style="color:#A32D2D">${m}</span>`; }

function removeFromBatch(i){ BATCH.splice(i,1); renderBatch(); }

function renderBatch(){
  const el = document.getElementById('batchList');
  const rb = document.getElementById('reviewBtn');
  if(!BATCH.length){ el.innerHTML=''; rb.style.display='none'; return; }
  el.innerHTML = `<div class="muted" style="margin-bottom:4px">${BATCH.length} item${BATCH.length>1?'s':''} added, not saved yet:</div>` +
    BATCH.map((it,i)=>`<div class="batchrow">
      <span><span class="pill p-${it.type}">${TYPE_LABEL[it.type]}</span> ${it.qty} × ${it.product}${it.orderRef?' · #'+it.orderRef:''}</span>
      <button class="rm" onclick="removeFromBatch(${i})" title="Remove">✕</button>
    </div>`).join('');
  rb.style.display = 'block';
}

// ── Step 2: review screen ──
function showReview(){
  const by = document.getElementById('by').value.trim();
  if(!by){ document.getElementById('addmsg').innerHTML = err('Enter your name first.'); return; }
  document.getElementById('entryCard').style.display='none';
  document.getElementById('reviewCard').style.display='block';
  document.getElementById('reviewList').innerHTML =
    `<div class="muted" style="margin-bottom:8px">By <b>${by}</b> — ${BATCH.length} item${BATCH.length>1?'s':''}</div>` +
    BATCH.map(it=>`<div class="batchrow">
      <span><span class="pill p-${it.type}">${TYPE_LABEL[it.type]}</span> ${it.date} · ${it.qty} × ${it.product}${it.orderRef?' · #'+it.orderRef:''}${it.note?' · '+it.note:''}</span>
    </div>`).join('');
  window.scrollTo({top:0,behavior:'smooth'});
}
function backToEntry(){
  document.getElementById('reviewCard').style.display='none';
  document.getElementById('entryCard').style.display='block';
}

async function submitBatch(){
  const by = document.getElementById('by').value.trim();
  const btn = document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='Saving…';
  try{
    const r = await api({action:'add_batch', by, items:BATCH});
    DATA = r.data;
    localStorage.setItem('maarg_inv_name', by);
    BATCH = [];
    renderBatch();
    document.getElementById('reviewCard').style.display='none';
    document.getElementById('entryCard').style.display='block';
    document.getElementById('addmsg').innerHTML = `<span style="color:#1F7A3B">✓ Saved ${r.events.length} item(s).</span>`;
    render();
  }catch(e){
    document.getElementById('submitmsg').innerHTML = err(e.message);
  }
  btn.disabled=false; btn.textContent='✓ Confirm & Save All';
}

// ── Stock table (with top-seller highlight) ──
function topSeller(){
  const totals = {};
  active().filter(e=>e.type==='dispatched').forEach(e=>{ totals[e.product]=(totals[e.product]||0)+e.qty; });
  let best=null, max=0;
  for(const [p,q] of Object.entries(totals)) if(q>max){ max=q; best=p; }
  return best;
}
function render(){
  const {stock,damaged} = computeStock();
  const top = topSeller();
  document.getElementById('stock').innerHTML =
    `<tr><th>Product</th><th class="num">In warehouse</th><th class="num">Damaged</th></tr>` +
    DATA.products.map(p=>{
      const st=stock[p]||0, dm=damaged[p]||0;
      return `<tr><td>${p}${p===top?' <span class="topseller">🔥 Top seller</span>':''}</td>
        <td class="num ${st<=LOW_STOCK?'low':''}">${st.toLocaleString()}</td>
        <td class="num" style="color:${dm?'#A32D2D':'#ccc'}">${dm||'—'}</td></tr>`;
    }).join('');
  renderHistory();
}

// ── Grouped-by-day history, date-range filterable, shows ALL vendor
// entries (not just whoever is currently typed into "Your name") ──
let HISTFROM=null, HISTTO=null;
function setHistRange(k,el){
  const iso=d=>d.toISOString().slice(0,10), now=new Date(), t=iso(now);
  if(k==='today'){HISTFROM=t;HISTTO=t;}
  else if(k==='yesterday'){const y=new Date(now);y.setDate(y.getDate()-1);HISTFROM=HISTTO=iso(y);}
  else if(k==='7'||k==='30'){const s=new Date(now);s.setDate(s.getDate()-(+k-1));HISTFROM=iso(s);HISTTO=t;}
  else if(k==='all'){HISTFROM=null;HISTTO=null;}
  else {HISTFROM=document.getElementById('hf').value||null;HISTTO=document.getElementById('ht').value||null;}
  if(el){document.querySelectorAll('#app .dp').forEach(b=>b.classList.remove('on'));el.classList.add('on');}
  renderHistory();
}
// Default view: last 7 days, so the page stays short — older entries are
// one tap away via the date buttons above, not scrolled past.
{ const now=new Date(), s=new Date(now); s.setDate(s.getDate()-6);
  HISTFROM=s.toISOString().slice(0,10); HISTTO=now.toISOString().slice(0,10); }

function renderHistory(){
  let ev = active().filter(e => (!HISTFROM||e.date>=HISTFROM) && (!HISTTO||e.date<=HISTTO));
  ev.sort((a,b)=>(b.date+b.at).localeCompare(a.date+a.at));

  const byDay = {};
  ev.forEach(e => (byDay[e.date] = byDay[e.date]||[]).push(e));
  const days = Object.keys(byDay).sort().reverse();

  document.getElementById('hist').innerHTML = days.length ? days.map((d,idx)=>{
    const items = byDay[d];
    const counts = {};
    items.forEach(e=>counts[e.type]=(counts[e.type]||0)+e.qty);
    const summary = Object.entries(counts).map(([t,q])=>`${TYPE_LABEL[t]} ${q}`).join(' · ');
    return `<div class="dayhead" onclick="toggleDay(${idx})">
        <span class="l">${d}</span>
        <span class="r">${items.length} item${items.length>1?'s':''} · ${summary} <span id="arw${idx}">▸</span></span>
      </div>
      <div class="dcontent" id="dc${idx}">
        ${items.map(e=>`<div class="batchrow">
          <span><span class="pill p-${e.type}">${TYPE_LABEL[e.type]}</span> ${e.qty} × ${e.product}${e.orderRef?' · #'+e.orderRef:''}${e.note?' · '+e.note:''}</span>
          <span class="muted">${e.by}</span>
        </div>`).join('')}
      </div>`;
  }).join('') : '<div class="muted" style="padding:14px 0">No entries yet.</div>';
}
function toggleDay(i){
  const c = document.getElementById('dc'+i); const a = document.getElementById('arw'+i);
  const open = c.classList.toggle('open'); a.textContent = open?'▾':'▸';
}
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('by').addEventListener('input', ()=>{ if(DATA) renderHistory(); });
});
</script>
</body>
</html>
